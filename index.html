<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IMEI</title>

<style>
body{
    margin:0;
    background:#111;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

button{
    padding:16px 24px;
    border-radius:14px;
    border:0;
    background:#0A84FF;
    color:#fff;
    font-size:18px;
}

#bg{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.5);
    display:none;
}

#sheet{
    position:fixed;
    left:0;
    right:0;
    bottom:-100%;
    background:#1C1C1E;
    border-radius:24px 24px 0 0;
    padding:20px;
    transition:.3s;
}

.show #bg{
    display:block;
}

.show #sheet{
    bottom:0;
}

.row{
    margin:16px 0;
}

.label{
    color:#8E8E93;
    font-size:14px;
}

.value{
    font-size:20px;
    margin-top:6px;
    word-break:break-all;
}

.barcode{
    height:48px;
    margin-top:10px;
    background:repeating-linear-gradient(
        90deg,
        #000 0 3px,
        #fff 3px 6px
    );
}

.cancel{
    margin-top:24px;
    text-align:center;
    color:#0A84FF;
    font-size:18px;
    cursor:pointer;
}
</style>
</head>

<body>

<button onclick="document.body.classList.add('show')">
Показать сведения
</button>

<div id="bg" onclick="document.body.classList.remove('show')"></div>

<div id="sheet">

<h2>Сведения об устройстве</h2>

<div class="row">
<div class="label">EID</div>
<div class="value" contenteditable>
89049032007008882600086850939587
</div>
<div class="barcode"></div>
</div>

<div class="row">
<div class="label">IMEI</div>
<div class="value" contenteditable>
350108845124392
</div>
<div class="barcode"></div>
</div>

<div class="row">
<div class="label">IMEI2</div>
<div class="value" contenteditable>
350108845320735
</div>
<div class="barcode"></div>
</div>

<div class="row">
<div class="label">MEID</div>
<div class="value" contenteditable>
35010884512439
</div>
<div class="barcode"></div>
</div>

<div class="cancel"
onclick="document.body.classList.remove('show')">
Отменить
</div>

</div>

</body>
</html>
