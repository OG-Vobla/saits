<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Сведения об устройстве</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif;
}

body{
background:#000;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
color:#fff;
}

button{
background:#0A84FF;
color:#fff;
border:none;
padding:16px 28px;
font-size:18px;
border-radius:16px;
font-weight:600;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
backdrop-filter:blur(12px);
opacity:0;
pointer-events:none;
transition:.3s;
}

.overlay.show{
opacity:1;
pointer-events:auto;
}

.sheet{
position:fixed;
left:0;
right:0;
bottom:-100%;
background:#1c1c1e;
border-radius:26px 26px 0 0;
padding:20px;
transition:.45s cubic-bezier(.25,.8,.25,1);
max-height:90vh;
overflow:auto;
}

.sheet.show{
bottom:0;
}

.grabber{
width:46px;
height:5px;
border-radius:10px;
background:#666;
margin:0 auto 15px;
}

h1{
text-align:center;
font-size:32px;
margin-bottom:24px;
margin-top:10px;
}

.item{
margin-bottom:28px;
}

.label{
font-size:17px;
text-align:center;
opacity:.8;
margin-bottom:8px;
}

.value{
font-size:17px;
text-align:center;
word-break:break-all;
margin-bottom:10px;
}

.barcode{
background:#fff;
padding:12px;
display:flex;
justify-content:center;
border-radius:2px;
margin-right:10px;
margin-left:10px;
}

svg{
width:100%;
height:80px;
}

.close{
position:absolute;
top:18px;
left:20px;
color:#0A84FF;
font-size:20px;
background:none;
padding:0;
}
</style>
</head>

<body>

<button onclick="openSheet()">
Показать сведения
</button>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>

<div class="sheet" id="sheet">

<button class="close" onclick="closeSheet()">Отменить</button>

<div class="grabber"></div>

<h1>Сведения<br>об устройстве</h1>

<div id="content"></div>

</div>

<script>
const data=[
{
title:"EID", value:"89049032007008882600086850939587"
},
{
title:"IMEI", value:"357727927570223"
},
{
title:"IMEI2", value:"350108845320735"
},
{
title:"MEID", value:"35010884512439"
}
];

function barcode(text){

let bits="";

for(let c of text){

let b=c.charCodeAt(0).toString(2).padStart(8,"0");

bits+=b;

}

let w=2;

let h=80;

let svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${bits.length*w} ${h}">`;

for(let i=0;i<bits.length;i++){

if(bits[i]=="1"){

svg+=`<rect x="${i*w}" y="0" width="${w}" height="${h}" fill="black"/>`;

}

}

svg+="</svg>";

return svg;

}

const container=document.getElementById("content");

data.forEach(d=>{

container.innerHTML+=`
<div class="item">

<div class="value">${d.title} ${d.value}</div>

<div class="barcode">
${barcode(d.value)}
</div>

</div>
`;

});

function openSheet(){

document.getElementById("overlay").classList.add("show");

document.getElementById("sheet").classList.add("show");

}

function closeSheet(){

document.getElementById("overlay").classList.remove("show");

document.getElementById("sheet").classList.remove("show");

}
</script>

</body>
</html>
